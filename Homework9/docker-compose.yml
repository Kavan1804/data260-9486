# HW9: Redis for the view counter and the semantic cache (kept separate from the HW8 docker-compose.yml).
# redis:8.2.2 ships the Redis Query Engine (FT.CREATE / vector search) in the official image.
# Start:  docker compose -f Homework9/docker-compose.yml up -d      (or make redis-up)
# This instance is only used for homework; every key the HW9 code writes still starts with s9486:
name: s9486-hw09

services:
  redis:
    image: redis:8.2.2
    container_name: s9486_redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 1s
