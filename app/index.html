<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW1-Kavan Siddesh Kumar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-container">
        <header class="page-header">
            <p class="eyebrow">DATA 260 · HOMEWORK 1</p>
            <h1>Rental Housing Listing</h1>
            <p class="subtitle">
                Submit a rental property for prospective tenants to review.
            </p>
        </header>

        <form id="listingForm">
            <div class="form-group">
                <label for="title">Listing Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Modern Downtown Apartment"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="address">Property Address</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Example: 100 East San Carlos Street, San Jose, CA"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Submitter Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Example: owner@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Listing Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    placeholder="Describe the property, amenities, rent, and availability."
                    required
                ></textarea>
                <p class="field-hint">The description must contain more than 25 characters.</p>
            </div>

            <div class="form-group">
                <label for="category">Property Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a property category</option>
                    <option value="Apartment">Apartment</option>
                    <option value="House">House</option>
                    <option value="Townhouse">Townhouse</option>
                    <option value="Studio">Studio</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input
                    type="checkbox"
                    id="termsAccepted"
                    name="termsAccepted"
                >
                <label for="termsAccepted">I agree to the terms and conditions.</label>
            </div>

            <button type="submit">Publish Rental Listing</button>

            <p id="submissionStatus" class="submission-status" aria-live="polite"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
