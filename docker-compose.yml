# HW8: Kafka (KRaft, no Zookeeper) + topic setup + Listing worker + FastAPI on PORT_BASE 8486.
# Start:  make kafka-up     Stop:  make kafka-down
# Host programs use localhost:9092, containers use kafka:29092.
name: s9486-hw08

services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: s9486_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Every topic is created on purpose by scripts/kafka_create_topics.sh.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # My Mac has 8 GB and also runs Ollama, so the broker gets a small heap.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    healthcheck:
      # Each check starts a JVM, so check every 3 s only while starting, then every 60 s.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      start_period: 90s
      start_interval: 3s
      interval: 60s
      timeout: 20s
      retries: 5

  kafka-init:
    image: apache/kafka:3.9.2
    container_name: s9486_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/kafka_create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh", "kafka:29092"]
    restart: "no"

  worker:
    build: .
    image: s9486-hw08-app
    container_name: s9486_worker
    command: ["python", "-m", "kafka_service.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_HOST_OVERRIDE: host.docker.internal
      WORKER_IDEMPOTENCY: ${WORKER_IDEMPOTENCY:-on}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    image: s9486-hw08-app  # built by the worker service
    pull_policy: never
    container_name: s9486_api
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8486"]
    ports:
      - "127.0.0.1:8486:8486"
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_HOST_OVERRIDE: host.docker.internal
      MONGODB_URI: mongodb://host.docker.internal:27017
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      worker:
        condition: service_started
    restart: unless-stopped
